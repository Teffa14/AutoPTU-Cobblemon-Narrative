name: Global NPC AI Regressions

on:
  push:
    branches: [main]
    paths:
      - 'tools/global_npc_ai.py'
      - 'tools/global_npc_social.py'
      - 'tools/global_npc_travel.py'
      - 'tools/global_npc_memory.py'
      - 'tools/global_npc_information_network.py'
      - 'tools/global_npc_replanning.py'
      - 'tools/global_npc_audience.py'
      - 'tools/global_npc_communication_runtime.py'
      - 'implementation/global-npc-ai-*.json'
      - 'implementation/global-npc-goal-need-schedule-*.json'
      - 'implementation/global-npc-social-*.json'
      - 'implementation/global-npc-travel-*.json'
      - 'implementation/global-npc-memory-*.json'
      - 'implementation/global-npc-information-*.json'
      - 'implementation/global-npc-event-replanning-*.json'
      - 'implementation/global-npc-audience-*.json'
      - 'implementation/global-npc-communication-*.json'
      - 'tests/test_global_npc_*.py'
      - 'design/global-npc-*.md'
      - 'CURRENT_FOCUS.md'
      - '.github/workflows/global-npc-ai.yml'
  pull_request:
    paths:
      - 'tools/global_npc_ai.py'
      - 'tools/global_npc_social.py'
      - 'tools/global_npc_travel.py'
      - 'tools/global_npc_memory.py'
      - 'tools/global_npc_information_network.py'
      - 'tools/global_npc_replanning.py'
      - 'tools/global_npc_audience.py'
      - 'tools/global_npc_communication_runtime.py'
      - 'implementation/global-npc-ai-*.json'
      - 'implementation/global-npc-goal-need-schedule-*.json'
      - 'implementation/global-npc-social-*.json'
      - 'implementation/global-npc-travel-*.json'
      - 'implementation/global-npc-memory-*.json'
      - 'implementation/global-npc-information-*.json'
      - 'implementation/global-npc-event-replanning-*.json'
      - 'implementation/global-npc-audience-*.json'
      - 'implementation/global-npc-communication-*.json'
      - 'tests/test_global_npc_*.py'
      - 'design/global-npc-*.md'
      - 'CURRENT_FOCUS.md'
      - '.github/workflows/global-npc-ai.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay global NPC base fixture
        run: python tools/global_npc_ai.py implementation/global-npc-ai-agent-fixture-v1.json
      - name: Replay global NPC agenda fixture
        run: python tools/global_npc_ai.py implementation/global-npc-goal-need-schedule-fixture-v1.json
      - name: Replay global NPC social fixture
        run: python -m tools.global_npc_social implementation/global-npc-social-relationship-faction-fixture-v1.json
      - name: Replay global NPC travel fixture
        run: python -m tools.global_npc_travel implementation/global-npc-travel-fixture-v1.json
      - name: Replay global NPC memory fixture
        run: python -m tools.global_npc_memory implementation/global-npc-memory-belief-communication-fixture-v1.json
      - name: Replay global NPC information propagation fixture
        run: python -m tools.global_npc_information_network implementation/global-npc-information-propagation-fixture-v1.json
      - name: Replay global NPC event replanning fixture
        run: python -m tools.global_npc_replanning implementation/global-npc-event-replanning-fixture-v1.json
      - name: Replay global NPC audience resolution fixture
        run: python -m tools.global_npc_audience implementation/global-npc-audience-resolution-fixture-v1.json
      - name: Replay global NPC communication runtime fixture
        run: python -m tools.global_npc_communication_runtime implementation/global-npc-communication-runtime-fixture-v1.json
      - name: Run global NPC AI regressions
        run: python -m unittest discover -s tests -p 'test_global_npc_*.py' -v
